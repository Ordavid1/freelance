name: Deploy engine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-engine
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          if test -f package.json && test -f package-lock.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Waiting for the application source from the laptop.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/561053183039/locations/global/workloadIdentityPools/github/providers/freelance
          service_account: freelance-deployer@freelance-514118.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - run: scripts/deploy-engine.sh
