name: Inspect Cardcom production setup
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/561053183039/locations/global/workloadIdentityPools/github/providers/freelance
          service_account: freelance-deployer@freelance-514118.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect production references and access
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          python3 - <<'PY'
          import json, subprocess
          def read(args):
              p=subprocess.run(['gcloud',*args,'--format=json','--quiet'],capture_output=True,text=True)
              if p.returncode:return {'accessible':False}
              return {'accessible':True,'data':json.loads(p.stdout or '{}')}
          result={}
          for project in ['freelance-514118','crypto-coral-328619']:
              r=read(['secrets','list','--project='+project])
              result[project]={'secretsAccessible':r['accessible']}
              if r['accessible']:
                  result[project]['cardcomSecrets']=[s['name'] for s in r['data'] if 'cardcom' in s['name'].lower()]
          r=read(['run','services','describe','freelance-engine','--project=freelance-514118','--region=me-west1'])
          result['runtimeAccessible']=r['accessible']
          if r['accessible']:
              template=r['data'].get('spec',{}).get('template',{}).get('spec',{})
              result['runtimeAccount']=template.get('serviceAccountName')
              result['billingEnvNames']=[e['name'] for c in template.get('containers',[]) for e in c.get('env',[]) if e['name'].startswith(('CARDCOM_','BILLING_'))]
          with open('billing-diagnostics.json','w') as f:json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: billing-diagnostics
          path: billing-diagnostics.json
          retention-days: 1
